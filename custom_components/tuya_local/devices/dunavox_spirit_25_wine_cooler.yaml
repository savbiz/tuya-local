name: Dual-zone wine cooler

products:
  - id: c6mozff2a2vgacya
    manufacturer: Dunavox
    model: Spirit 25
    model_id: DVS-25.65

entities:
  - entity: switch
    name: Power
    icon: "mdi:power"
    dps:
      - id: 1
        type: boolean
        name: switch

  - entity: binary_sensor
    name: Fault
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true

      - id: 10
        type: bitfield
        name: fault_code

      - id: 10
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: "OK"
          - dps_val: 1
            value: "Temperature too low"
          - dps_val: 2
            value: "Temperature too high"
          - dps_val: 4
            value: "Door warning"
          - dps_val: 8
            value: "Temperature sensor fault"

  - entity: number
    name: Upper zone target temperature
    class: temperature
    category: config
    icon: "mdi:thermometer-chevron-up"
    mode: box
    dps:
      - id: 110
        type: integer
        name: value
        unit: C
        range:
          min: 5
          max: 10
        mapping:
          - step: 1

  - entity: number
    name: Lower zone target temperature
    class: temperature
    category: config
    icon: "mdi:thermometer-chevron-down"
    mode: box
    dps:
      - id: 111
        type: integer
        name: value
        unit: C
        range:
          min: 10
          max: 18
        mapping:
          - step: 1

  - entity: select
    name: Operating mode
    icon: "mdi:tune"
    category: config
    dps:
      - id: 12
        type: string
        name: option
        mapping:
          - dps_val: std
            value: Standard
          - dps_val: eco
            value: Eco
          - dps_val: demo
            value: Demo
          - dps_val: sab
            value: Sabbath

  - entity: select
    name: Light colour
    icon: "mdi:palette"
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: white
            value: White
          - dps_val: blue
            value: Blue
          - dps_val: warm_white
            value: Warm white

  - entity: select
    name: Lamp mode
    icon: "mdi:lightbulb-auto"
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: door_control
            value: Door Control
          - dps_val: 24h
            value: 24 hours
          - dps_val: 30min
            value: 30 minutes
          - dps_val: 1min
            value: 1 minute

  - entity: select
    name: Light brightness
    icon: "mdi:brightness-6"
    category: config
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "50"
            value: "50%"
          - dps_val: "75"
            value: "75%"
          - dps_val: "100"
            value: "100%"

  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 5
        type: boolean
        name: lock

  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
